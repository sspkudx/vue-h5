name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-test-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # pnpm/action-setup 在 setup-node 之前：保证 pnpm 进入 PATH，
            # setup-node 的 cache: pnpm 才能定位 pnpm store 并正确缓存
            # （版本取自 packageManager 字段，corepack 对齐）
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm lint

            - name: Stylelint
              run: pnpm lint:style

            - name: Prettier 检查
              run: pnpm format:check

            - name: 文档/模板漂移检查（README/docs/技能模板 vs 真实代码）
              run: pnpm check:docs

            - name: 单元测试
              run: pnpm test

            - name: 完整构建（packages + apps）
              run: pnpm build
