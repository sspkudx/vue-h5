name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-test-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 启用 corepack（对齐 packageManager 声明的 pnpm 版本）
              run: corepack enable

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm lint

            - name: Stylelint
              run: pnpm lint:style

            - name: Prettier 检查
              run: pnpm format:check

            - name: 文档/模板漂移检查（README/docs/技能模板 vs 真实代码）
              run: pnpm check:docs

            - name: 单元测试
              run: pnpm test

            - name: 完整构建（packages + apps）
              run: pnpm build
