name: CI

on:
    push:
        branches: [compat/node-14]
    pull_request:

jobs:
    lint-test-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - uses: actions/setup-node@v3
              with:
                  node-version: 14

            - name: 安装 pnpm 7（Node 14 兼容版本）
              run: npm install -g pnpm@7

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm lint

            - name: Stylelint
              run: pnpm lint:style

            - name: Prettier 检查
              run: pnpm format:check

            - name: 单元测试
              run: pnpm test

            - name: 完整构建（packages + apps）
              run: pnpm build
