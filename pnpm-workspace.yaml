packages:
    - 'apps/*'
    - 'packages/*'
    # 开发启动器控制台前端（Vue 3 + Vite，产物由 scripts/dev-launcher/server.mjs 托管）
    - 'scripts/dev-launcher/web'

# pnpm 11+ 配置统一迁移至本文件（.npmrc 仅保留 registry/auth）
shamefullyHoist: true
engineStrict: true

# pnpm 11 默认不执行依赖的构建脚本；core-js（legacy 产物 polyfill）与
# unrs-resolver（eslint 原生解析器）为必要依赖，显式放行。
allowBuilds:
    core-js: true
    unrs-resolver: true

catalogs:
    default:
        axios: ^1.19.0
        pinia: ^4.0.3
        ress: ^6.0.0
        vue: ^3.5.41
        vue-router: ^5.2.0
        # 测试框架（vitest + v8 覆盖率，2026-08 起替代 jest/ts-jest）
        vitest: ^4.1.11
        '@vitest/coverage-v8': ^4.1.11
        # dev-launcher-web 构建链（与根 devDependencies 同版本）
        '@vitejs/plugin-vue': ^6.0.8
        '@vitejs/plugin-vue-jsx': ^5.1.6
        typescript: ^6.0.3
        vite: ^8.2.2
        vue-tsc: ^3.3.11

# 依赖更新策略：采用 pnpm 11 默认的 minimumReleaseAge=1440（新版本发布满 24h 后才被采纳），
# 避免激进更新刚发布的版本。个别已进入锁文件的新发布包或必须抢新的包，用
# minimumReleaseAgeExclude 按版本白名单放行。
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    # stylelint 的 csstree 语法补丁包，升级 stylelint 时随依赖进入锁文件，豁免本次发布延迟
    - '@csstools/css-syntax-patches-for-csstree@1.1.8'
